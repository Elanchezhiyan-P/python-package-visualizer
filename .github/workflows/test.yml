name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Unit coverage gate
        run: npm run test:coverage:check

      - name: Patch coverage gate
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: node scripts/check-patch-coverage.mjs $COVERAGE_BASE

      - name: Lint
        run: npm run lint
